apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: staging-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/developer-experience-DevEX-platform/platform-gitops.git
        revision: main
        directories:
          - path: environments/staging/*
  template:
    metadata:
      name: '{{.path.basename}}-staging'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/developer-experience-DevEX-platform/platform-helm-charts.git
          targetRevision: main
          path: charts/service
          helm:
            valueFiles:
              - '$values/environments/staging/{{.path.basename}}/values.yaml'
        - repoURL: https://github.com/developer-experience-DevEX-platform/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
