apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: production-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/developer-experience-DevEX-platform/platform-gitops.git
        revision: main
        files:
          - path: environments/production/*/promotion.yaml
  template:
    metadata:
      name: '{{index .path.segments 2}}-production'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/developer-experience-DevEX-platform/platform-helm-charts.git
          targetRevision: main
          path: charts/service
          helm:
            valueFiles:
              - '$values/environments/production/{{index .path.segments 2}}/values.yaml'
        - repoURL: https://github.com/developer-experience-DevEX-platform/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 2}}-production'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
